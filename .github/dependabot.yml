version: 2
updates:
  - package-ecosystem: nuget
    directory: "/Lumisense"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-packages:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
