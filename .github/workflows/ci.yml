name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "Lumisense/Lumisense.csproj"
          $version = ([string]$project.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Project Version must use SemVer: '$version'."
          }
          Write-Host "Validated project version $version"

      - name: Restore dependencies
        run: dotnet restore Lumisense/Lumisense.csproj

      - name: Build Windows application
        run: dotnet build Lumisense/Lumisense.csproj --configuration Release --no-restore

      - name: Run tests when a test project exists
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Recurse -Filter '*Tests.csproj' | Select-Object -ExpandProperty FullName
          if ($projects.Count -eq 0) {
            Write-Host "No test project exists yet; build validation completed."
            exit 0
          }
          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet test $project --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Fail on known vulnerable NuGet dependencies
        shell: pwsh
        run: |
          $report = dotnet list Lumisense/Lumisense.csproj package --vulnerable --include-transitive --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit could not complete." }
          if ($report -match '"severity"\s*:') {
            Write-Error $report
            throw "Known vulnerable NuGet dependencies were reported."
          }
          Write-Host "No vulnerable NuGet dependencies reported."
