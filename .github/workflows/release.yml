# Автосборка и публикация релиза.
#
# Срабатывает на пуш тега вида "v1.5.0" (можно также запустить вручную из вкладки Actions на
# GitHub — см. workflow_dispatch ниже, удобно для проверки без реального релиза).
#
# Что делает:
#   1. Собирает Lumisense (dotnet publish, self-contained win-x64 — см. Lumisense.csproj).
#   2. Собирает установщик Installer/Lumisense.iss (Inno Setup), передавая ему номер версии
#      из тега через /DMyAppVersion — см. #ifndef MyAppVersion в самом .iss.
#   3. Проверяет Changelog/changelog.json до сборки: JSON, обязательные поля, типы и текст
#      изменений. Затем берёт последнюю запись в том же порядке, что и приложение
#      (ChangelogLoader.AssignComputedFields), и формирует Markdown с разделами
#      «Добавлено», «Изменено», «Исправлено» и «Удалено».
#   4. Собирает Velopack full/delta packages и MSI PerMachine для установок, которые уже
#      прошли осознанный переход на новый updater. Legacy-копии остаются на Inno Setup.
#   5. Публикует релиз на GitHub с versioned Inno EXE и Velopack assets: legacy UpdateChecker
#      выбирает Inno EXE по номеру release, а Velopack-managed копия читает releases.win.json.
#
# ВАЖНО перед тем как поставить тег: добавьте в Changelog/changelog.json новую запись со
# списком изменений. Дату указывать больше не обязательно: новые записи привязаны к версии,
# а не к дате. Некорректный changelog остановит workflow до сборки и публикации релиза.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для тестовой сборки без тега (например 1.5.0)"
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          Write-Host "Версия релиза: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Этот шаг выполняется до сборки. Ошибка структуры changelog останавливает
      # workflow до создания установщика и публикации неполного GitHub Release.
      - name: Validate changelog and prepare structured release notes
        id: notes
        shell: pwsh
        run: |
          & .\tools\Prepare-ReleaseChangelog.ps1 `
            -ChangelogPath "Lumisense\Changelog\changelog.json" `
            -OutputPath "release_notes.md" `
            -Version "${{ steps.ver.outputs.version }}"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      # Тег не должен публиковать регрессию, даже если обычный CI ещё не завершился.
      - name: Restore, build and test before packaging
        shell: pwsh
        run: |
          dotnet restore Lumisense/Lumisense.csproj
          if ($LASTEXITCODE -ne 0) { throw "Restore of Lumisense.csproj failed." }

          dotnet build Lumisense/Lumisense.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build of Lumisense.csproj failed." }

          $projects = Get-ChildItem -Recurse -Filter '*Tests.csproj' | Select-Object -ExpandProperty FullName
          # xUnit v3 uses Microsoft Testing Platform. The repository global.json selects MTP
          # for .NET 10 SDKs, avoiding the unsupported fallback to VSTest during release tests.
          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { throw "Restore of $project failed." }
            dotnet test --project $project --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Tests failed in $project." }
          }

      - name: Fail release on known vulnerable NuGet dependencies
        shell: pwsh
        run: |
          $report = dotnet list Lumisense/Lumisense.csproj package --vulnerable --include-transitive --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit could not complete." }
          if ($report -match '"severity"\s*:') {
            Write-Error $report
            throw "Known vulnerable NuGet dependencies were reported; release blocked."
          }
          Write-Host "No vulnerable NuGet dependencies reported."

      - name: Publish Lumisense (self-contained win-x64)
        run: dotnet publish Lumisense/Lumisense.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }}

      - name: Verify published assembly version
        shell: pwsh
        run: |
          $exe = "Lumisense\bin\Release\net9.0-windows10.0.19041.0\win-x64\publish\Lumisense.exe"
          if (-not (Test-Path $exe)) { throw "Published Lumisense.exe was not found." }
          $productVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          if ($productVersion -notmatch "^${{ steps.ver.outputs.version }}(?:[+\\-].*)?$") {
            throw "Published assembly version '$productVersion' does not match release version '${{ steps.ver.outputs.version }}'."
          }
          Write-Host "Verified assembly version $productVersion"

      # Получаем прошлый Velopack release feed до упаковки: это позволяет автоматически
      # создать delta между уже установленной Velopack-версией и новым release. На самом первом
      # migration-релизе Velo assets ещё отсутствуют — это ожидаемо, поэтому шаг не фатален.
      - name: Install Velopack CLI and restore prior Windows feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install --global vpk --version 1.2.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Path VelopackReleases -Force | Out-Null
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --channel win `
            --outputDir VelopackReleases `
            --token $env:GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "No prior Velopack win feed is available yet; this migration release will publish a full package only."
            $global:LASTEXITCODE = 0
          }

      - name: Package Velopack full/delta packages and MSI PerMachine
        shell: pwsh
        run: |
          vpk pack `
            --packId Wasssly.Lumisense `
            --packVersion "${{ steps.ver.outputs.version }}" `
            --packDir "Lumisense\bin\Release\net9.0-windows10.0.19041.0\win-x64\publish" `
            --mainExe Lumisense.exe `
            --runtime win-x64 `
            --channel win `
            --outputDir VelopackReleases `
            --packTitle Lumisense `
            --packAuthors wasssly `
            --icon "Lumisense\Icons\app\lumisense.ico" `
            --releaseNotes release_notes.md `
            --noPortable true `
            --msi true `
            --instLocation PerMachine
          if ($LASTEXITCODE -ne 0) { throw "Velopack package creation failed." }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build versioned Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "Installer\Lumisense.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed." }
          $source = "Lumisense_Setup.exe"
          $target = "Lumisense-${{ steps.ver.outputs.version }}-Setup.exe"
          if (-not (Test-Path $source)) { throw "Inno Setup output '$source' was not found." }
          Move-Item -Path $source -Destination $target -Force
          Write-Host "Prepared versioned Inno Setup asset: $target"

      - name: Create GitHub Release
        id: release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "Lumisense ${{ steps.ver.outputs.version }}"
          body_path: release_notes.md
          files: Lumisense-${{ steps.ver.outputs.version }}-Setup.exe

      # merge добавляет `releases.win.json`, full/delta nupkg и MSI в уже созданный GitHub
      # Release. Он не нужен для legacy Inno Setup, но без него Velopack не сможет найти feed.
      - name: Publish Velopack Windows feed to the existing GitHub Release
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --channel win `
            --outputDir VelopackReleases `
            --token $env:GITHUB_TOKEN `
            --publish true `
            --merge true `
            --releaseName "Lumisense ${{ steps.ver.outputs.version }}" `
            --tag "v${{ steps.ver.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Velopack asset upload failed." }

      # vpk upload reads the assets manifest written by vpk pack, which includes its Setup
      # bootstrapper. The file must therefore stay in VelopackReleases until the upload finishes.
      # Lumisense publishes the legacy Lumisense_Setup.exe and the MSI migration asset instead,
      # so remove only the extra Velopack bootstrapper from GitHub after the feed is uploaded.
      - name: Remove non-public Velopack Setup bootstrapper from GitHub Release
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$env:RELEASE_VERSION"
          $release = Invoke-RestMethod -Headers $headers -Uri $releaseUri
          $bootstrapperAssets = @($release.assets | Where-Object { $_.name -eq "Wasssly.Lumisense-win-Setup.exe" })
          foreach ($asset in $bootstrapperAssets) {
            Write-Host "Removing non-public Velopack bootstrapper from GitHub Release: $($asset.name)"
            Invoke-RestMethod -Headers $headers -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)"
          }
          $remainingAssets = @((Invoke-RestMethod -Headers $headers -Uri $releaseUri).assets |
            Where-Object { $_.name -eq "Wasssly.Lumisense-win-Setup.exe" })
          if ($remainingAssets.Count -ne 0) {
            throw "Velopack Setup bootstrapper must not remain in published release assets."
          }

      # Internal Velopack package IDs remain Wasssly.Lumisense to preserve the update identity
      # of existing MSI installs. Only the names exposed on the GitHub Release are made product-facing.
      # Original packages remain published until their renamed copies and the replacement feed succeed.
      # GitHub cannot atomically replace an asset with the same name, so clients can briefly see either
      # the old feed/assets or no feed, but never a feed that names deleted package files.
      - name: Rename public Velopack assets and rewrite Windows feed
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$env:RELEASE_VERSION"
          $release = Invoke-RestMethod -Headers $headers -Uri $releaseUri
          $oldFull = "Wasssly.Lumisense-$env:RELEASE_VERSION-full.nupkg"
          $oldDelta = "Wasssly.Lumisense-$env:RELEASE_VERSION-delta.nupkg"
          $oldMsi = "Wasssly.Lumisense-win.msi"
          $renameMap = [ordered]@{
            $oldFull = "Lumisense-$env:RELEASE_VERSION-full.nupkg"
            $oldDelta = "Lumisense-$env:RELEASE_VERSION-delta.nupkg"
            $oldMsi = "Lumisense-$env:RELEASE_VERSION-win-x64.msi"
          }

          $assetsByName = @{}
          foreach ($asset in $release.assets) { $assetsByName[$asset.name] = $asset }
          foreach ($oldName in $renameMap.Keys) {
            if (-not $assetsByName.ContainsKey($oldName)) {
              if ($oldName -eq $oldDelta) {
                Write-Warning "No delta package was created for this release; no delta rename is needed."
                continue
              }
              throw "Expected internal Velopack asset '$oldName' was not published."
            }
          }
          if (-not $assetsByName.ContainsKey("releases.win.json")) {
            throw "The published releases.win.json asset is missing."
          }

          $feedAsset = $assetsByName["releases.win.json"]
          $feedPath = Join-Path $env:RUNNER_TEMP "releases.win.json"
          Invoke-WebRequest -Uri $feedAsset.browser_download_url -OutFile $feedPath
          $feed = Get-Content -Raw -Path $feedPath | ConvertFrom-Json
          foreach ($entry in $feed.Assets) {
            if ($renameMap.Contains($entry.FileName) -and $assetsByName.ContainsKey($entry.FileName)) {
              $entry.FileName = $renameMap[$entry.FileName]
            }
          }
          $feed | ConvertTo-Json -Depth 8 -Compress | Set-Content -Path $feedPath -Encoding utf8NoBOM

          foreach ($oldName in $renameMap.Keys) {
            if (-not $assetsByName.ContainsKey($oldName)) { continue }
            $newName = $renameMap[$oldName]
            if ($assetsByName.ContainsKey($newName)) {
              Write-Host "Public asset '$newName' already exists; keeping it."
              continue
            }
            $sourcePath = Join-Path $env:RUNNER_TEMP $oldName
            Invoke-WebRequest -Uri $assetsByName[$oldName].browser_download_url -OutFile $sourcePath
            $uploadUri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($newName))"
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "Content-Type" = "application/octet-stream"; "X-GitHub-Api-Version" = "2022-11-28" } -Method Post -Uri $uploadUri -InFile $sourcePath | Out-Null
          }

          # GitHub rejects a second asset with the same name, so remove the old feed only after every
          # renamed package upload has succeeded. The original packages are still present at this point.
          Invoke-RestMethod -Headers $headers -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($feedAsset.id)"
          $feedUploadUri = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=releases.win.json"
          Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "Content-Type" = "application/octet-stream"; "X-GitHub-Api-Version" = "2022-11-28" } -Method Post -Uri $feedUploadUri -InFile $feedPath | Out-Null

          foreach ($oldName in $renameMap.Keys) {
            if ($assetsByName.ContainsKey($oldName)) {
              Invoke-RestMethod -Headers $headers -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($assetsByName[$oldName].id)"
            }
          }

      - name: Verify published release assets
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$env:RELEASE_VERSION"
          $legacyInstallerName = "Lumisense-$env:RELEASE_VERSION-Setup.exe"
          $legacyAssets = @($release.assets | Where-Object { $_.name -eq $legacyInstallerName })
          if ($legacyAssets.Count -ne 1) { throw "Expected exactly one $legacyInstallerName asset, found $($legacyAssets.Count)." }
          $legacyAsset = $legacyAssets[0]
          if ($legacyAsset.size -le 0 -or [string]$legacyAsset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "Published legacy installer is missing or has no valid SHA-256 digest."
          }

          $velFeed = @($release.assets | Where-Object { $_.name -eq "releases.win.json" })
          $velFull = @($release.assets | Where-Object { $_.name -eq "Lumisense-$env:RELEASE_VERSION-full.nupkg" })
          $velDelta = @($release.assets | Where-Object { $_.name -eq "Lumisense-$env:RELEASE_VERSION-delta.nupkg" })
          $velMsi = @($release.assets | Where-Object { $_.name -eq "Lumisense-$env:RELEASE_VERSION-win-x64.msi" })
          $oldVelopackNames = @($release.assets | Where-Object { $_.name -like "Wasssly.Lumisense-*" })
          $velBootstrapper = @($release.assets | Where-Object { $_.name -eq "Wasssly.Lumisense-win-Setup.exe" })
          if ($velBootstrapper.Count -ne 0) {
            throw "Velopack Setup bootstrapper must not be published; use the versioned Lumisense Setup.exe or the MSI migration asset."
          }
          if ($oldVelopackNames.Count -ne 0) {
            throw "Internal Wasssly.Lumisense asset names must not remain on the public release."
          }
          if ($velFeed.Count -ne 1 -or $velFull.Count -ne 1 -or $velMsi.Count -ne 1) {
            throw "Expected renamed Velopack win feed, current full package and versioned MSI migration asset on the release."
          }
          foreach ($asset in @($legacyAsset, $velFeed[0], $velFull[0], $velMsi[0]) + $velDelta) {
            if ($asset.size -le 0 -or [string]$asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
              throw "Published asset '$($asset.name)' is empty or has no valid SHA-256 digest."
            }
          }
          $feedUri = $velFeed[0].browser_download_url
          $publishedFeed = (Invoke-WebRequest -Uri $feedUri).Content | ConvertFrom-Json
          $currentFeedEntries = @($publishedFeed.Assets | Where-Object { $_.Version -eq $env:RELEASE_VERSION })
          foreach ($entry in $currentFeedEntries) {
            if ($entry.FileName -like "Wasssly.Lumisense-*" -or -not @($release.assets.name).Contains($entry.FileName)) {
              throw "Published releases.win.json references a missing or internal-named asset '$($entry.FileName)'."
            }
          }
          Write-Host "Verified legacy installer plus renamed public Velopack assets and a coherent Windows release feed; no bootstrapper was published."

      - name: Upload build artifact (manual test run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumisense_migration_build
          path: |
            Lumisense-${{ steps.ver.outputs.version }}-Setup.exe
            VelopackReleases
